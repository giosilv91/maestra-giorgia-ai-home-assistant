name: Build NP DataMatrix V5 APK

on:
  push:
    branches:
      - tmp-np-datamatrix-v5

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch Kotlin compile fixes
        run: |
          python3 - <<'PY'
          p='tmp_np_datamatrix_v5/app/src/main/java/com/np/datamatrixv5/MainActivity.kt'
          s=open(p,encoding='utf-8').read()
          if 'import androidx.camera.core.ImageCaptureException' not in s:
              s=s.replace('import androidx.camera.core.ImageCapture\n', 'import androidx.camera.core.ImageCapture\nimport androidx.camera.core.ImageCaptureException\n')
          s=s.replace('singleLine = true', 'isSingleLine = true')
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Build APK
        run: gradle -p tmp_np_datamatrix_v5 --no-daemon assembleDebug

      - name: Prepare APK
        run: cp tmp_np_datamatrix_v5/app/build/outputs/apk/debug/app-debug.apk NP_DataMatrix_V5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NP_DataMatrix_V5_Android
          path: NP_DataMatrix_V5.apk
          if-no-files-found: error
