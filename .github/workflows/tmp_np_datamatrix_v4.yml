name: Build NP DataMatrix V4 APK

on:
  push:
    branches:
      - tmp-np-datamatrix-v4-build4

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p tmp_np_datamatrix_v4 --no-daemon assembleDebug

      - name: Prepare APK
        run: cp tmp_np_datamatrix_v4/app/build/outputs/apk/debug/app-debug.apk NP_DataMatrix_V4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NP_DataMatrix_V4_Android
          path: NP_DataMatrix_V4.apk
          if-no-files-found: error
