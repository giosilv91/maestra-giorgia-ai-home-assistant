name: Build NP DataMatrix APK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle -p tmp_np_datamatrix --no-daemon assembleDebug

      - name: Prepare APK
        run: cp tmp_np_datamatrix/app/build/outputs/apk/debug/app-debug.apk NP_DataMatrix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NP_DataMatrix_Android
          path: NP_DataMatrix.apk
          if-no-files-found: error
