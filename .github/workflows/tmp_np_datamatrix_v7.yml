name: Build NP DataMatrix V7 APK

on:
  push:
    branches:
      - tmp-np-datamatrix-v7

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch V7 industrial multi-format reader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tmp_np_datamatrix_v5/app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('namespace = "com.np.datamatrixv5"', 'namespace = "com.np.datamatrixv7"')
          s=s.replace('applicationId = "com.np.datamatrixv5"', 'applicationId = "com.np.datamatrixv7"')
          s=s.replace('versionCode = 5', 'versionCode = 7')
          s=s.replace('versionName = "5.0"', 'versionName = "7.0"')
          s=s.replace('implementation("com.google.android.gms:play-services-code-scanner:16.1.0")\n', '')
          if 'io.github.zxing-cpp:android:3.1.1' not in s:
              s=s.replace('implementation("com.google.zxing:core:3.5.3")', 'implementation("com.google.zxing:core:3.5.3")\n    implementation("io.github.zxing-cpp:android:3.1.1")')
          p.write_text(s,encoding='utf-8')

          p=Path('tmp_np_datamatrix_v5/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8').replace('NP DataMatrix V5','NP DataMatrix V7')
          p.write_text(s,encoding='utf-8')

          p=Path('tmp_np_datamatrix_v5/app/src/main/java/com/np/datamatrixv5/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('package com.np.datamatrixv5','package com.np.datamatrixv7')
          s=s.replace('NP • DATAMATRIX V5','NP • DATAMATRIX V7')
          if 'import androidx.camera.core.ImageCaptureException' not in s:
              s=s.replace('import androidx.camera.core.ImageCapture\n', 'import androidx.camera.core.ImageCapture\nimport androidx.camera.core.ImageCaptureException\n')
          s=s.replace('singleLine = true','isSingleLine = true')
          for imp in [
              'import com.google.mlkit.vision.codescanner.GmsBarcodeScanner\n',
              'import com.google.mlkit.vision.codescanner.GmsBarcodeScannerOptions\n',
              'import com.google.mlkit.vision.codescanner.GmsBarcodeScanning\n']:
              s=s.replace(imp,'')
          if 'import androidx.camera.core.ImageAnalysis' not in s:
              s=s.replace('import androidx.camera.core.ImageCaptureException\n', 'import androidx.camera.core.ImageCaptureException\nimport androidx.camera.core.ImageAnalysis\n')
          if 'import zxingcpp.BarcodeReader' not in s:
              s=s.replace('import kotlin.math.max\n', 'import kotlin.math.max\nimport zxingcpp.BarcodeReader\nimport java.util.concurrent.Executors\n')
          old='''    private val mlScanner by lazy {\n        val options = BarcodeScannerOptions.Builder()\n            .setBarcodeFormats(Barcode.FORMAT_DATA_MATRIX)\n            .build()\n        BarcodeScanning.getClient(options)\n    }\n\n    private val gmsScanner: GmsBarcodeScanner by lazy {\n        val options = GmsBarcodeScannerOptions.Builder()\n            .setBarcodeFormats(Barcode.FORMAT_DATA_MATRIX)\n            .enableAutoZoom()\n            .build()\n        GmsBarcodeScanning.getClient(this, options)\n    }\n'''
          new='''    private val mlScanner by lazy { BarcodeScanning.getClient() }\n    private val cppReader by lazy { BarcodeReader() }\n    private val analyzerExecutor = Executors.newSingleThreadExecutor()\n    @Volatile private var lastLiveCode: String? = null\n    @Volatile private var lastLiveFormat: String = ""\n    @Volatile private var lastLiveAt: Long = 0L\n'''
          if old not in s: raise SystemExit('scanner block not found')
          s=s.replace(old,new)
          old='''                provider.unbindAll()\n                camera = provider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview, imageCapture)\n                camera?.cameraControl?.setZoomRatio(1.0f)\n                status.text = "Inquadra come nella fotocamera Samsung e premi SCATTA"\n'''
          new='''                val analysis = ImageAnalysis.Builder()\n                    .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)\n                    .build()\n                analysis.setAnalyzer(analyzerExecutor) { image ->\n                    try {\n                        val results = image.use { cppReader.read(it) }\n                        val hit = results.firstOrNull { it.text.isNotBlank() }\n                        if (hit != null) {\n                            lastLiveCode = hit.text.trim()\n                            lastLiveFormat = hit.format.toString()\n                            lastLiveAt = System.currentTimeMillis()\n                        }\n                    } catch (_: Exception) {\n                        try { image.close() } catch (_: Exception) {}\n                    }\n                }\n                provider.unbindAll()\n                camera = provider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview, imageCapture, analysis)\n                camera?.cameraControl?.setZoomRatio(1.0f)\n                status.text = "Inquadra il codice e premi SCATTA • lettore industriale interno"\n'''
          if old not in s: raise SystemExit('bind block not found')
          s=s.replace(old,new)
          old='''                    override fun onImageSaved(outputFileResults: ImageCapture.OutputFileResults) {\n                        status.text = "Analizzo lo scatto…"\n                        decodeStill(file)\n                    }\n'''
          new='''                    override fun onImageSaved(outputFileResults: ImageCapture.OutputFileResults) {\n                        status.text = "Analizzo lo scatto…"\n                        val live = lastLiveCode\n                        val fresh = live != null && (System.currentTimeMillis() - lastLiveAt) < 4500\n                        if (fresh) showDetected(live!!, "ZXing-C++ ${lastLiveFormat}") else decodeStill(file)\n                    }\n'''
          if old not in s: raise SystemExit('saved block not found')
          s=s.replace(old,new)
          s=s.replace('''                val value = barcodes.firstOrNull { it.format == Barcode.FORMAT_DATA_MATRIX }\n                    ?.rawValue?.trim().orEmpty()''','''                val value = barcodes.firstOrNull { !it.rawValue.isNullOrBlank() }\n                    ?.rawValue?.trim().orEmpty()''')
          s=s.replace('''                    if (!zxing.isNullOrBlank()) showDetected(zxing, "Scatto HD / DPM") else tryFallbackScanner()''','''                    if (!zxing.isNullOrBlank()) showDetected(zxing, "Scatto HD / DPM") else noCode("Codice non letto. Avvicina il codice e riprova.")''')
          s=s.replace('''                if (!zxing.isNullOrBlank()) showDetected(zxing, "Scatto HD / DPM") else tryFallbackScanner()''','''                if (!zxing.isNullOrBlank()) showDetected(zxing, "Scatto HD / DPM") else noCode("Codice non letto. Avvicina il codice e riprova.")''')
          s=s.replace('''        if (image == null) {\n            tryFallbackScanner()\n            return\n        }''','''        if (image == null) {\n            noCode("Immagine non analizzabile. Riprova.")\n            return\n        }''')
          a=s.find('    private fun tryFallbackScanner() {')
          b=s.find('    private fun tryZxing(file: File): String?', a)
          if a != -1 and b != -1: s=s[:a]+s[b:]
          s=s.replace('DataMatrix letto ($source). Confermi?', 'Codice letto ($source). Confermi?')
          marker='''    private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()\n'''
          if marker in s and 'override fun onDestroy()' not in s:
              s=s.replace(marker, '''    override fun onDestroy() {\n        super.onDestroy()\n        analyzerExecutor.shutdownNow()\n        try { mlScanner.close() } catch (_: Exception) {}\n    }\n\n''' + marker)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build APK
        run: gradle -p tmp_np_datamatrix_v5 --no-daemon assembleDebug

      - name: Prepare APK
        run: cp tmp_np_datamatrix_v5/app/build/outputs/apk/debug/app-debug.apk NP_DataMatrix_V7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NP_DataMatrix_V7_Android
          path: NP_DataMatrix_V7.apk
          if-no-files-found: error
